<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,minimum-scale=0.5" />
    <link rel="shortcut icon" type="image/x-icon" ahref="favicon.ico" />
    <title>移动端显卡</title>
    <style>
      .cpu_target {
        display: block;
        margin-bottom: 20px;
        font-size: 30px;
        text-decoration: none;
        color: #000;
        cursor: pointer;
      }
    </style>
  </head>

  <body style="text-align: center">
    <div style="text-align: left" id="cpuContainer">
      <a class="cpu_target" href="./index.html">手机SOC</a>
      <br />
    </div>
    <img class="imgShow" />
  </body>
  <script>
    const CPULIST = [
      {
        label: "桌面处理器",
        src: "./img/CPU202603.webp",
      },
      {
        label: "桌面处理器(暴雷)",
        src: "./img/CPU202408.webp",
      },
      {
        label: "桌面显卡",
        src: "./img/GPU202508.webp",
      },
      {
        label: "中正-移动端处理器",
        src: "./img/mcpu202507.webp",
      },
      {
        label: "刘花飞移动端处理器",
        src: "./img/[CPU天梯图]v2.4.0 20250811.webp",
      },
      {
        label: "极速空间移动端处理器",
        src: "./img/mCPUjs-202506.webp",
      },
      {
        label: "中正-移动端显卡",
        src: "./img/mgpu202508.webp",
      },
      {
        label: "刘花飞移动端显卡",
        src: "./img/[显卡天梯图]v6.3.3 20250811.webp",
      },
      {
        label: "极速空间移动端显卡",
        src: "./img/mgpujs-20250521.webp",
      },
    ];
    const container = document.getElementById("cpuContainer");

    // 遍历数据列表生成a标签
    CPULIST.forEach(item => {
      // 创建a标签元素
      const link = document.createElement("a");

      // 设置class属性
      link.className = "cpu_target";

      // 设置src属性
      link.setAttribute("src", item.src);

      // 设置链接文本内容
      link.textContent = item.label;

      // 将生成的a标签添加到容器中
      container.appendChild(link);

      // 可选：添加换行符，使链接在页面中换行显示
      container.appendChild(document.createElement("br"));
    });

    var cpuTarget = document.querySelectorAll(".cpu_target");
    cpuTarget.forEach(v => {
      v.addEventListener("click", function (e) {
        var imgUrl = e.currentTarget.getAttribute("src");
        console.log("图片路径:", imgUrl);
        const imgShow = document.querySelector(".imgShow");
        if (imgShow) {
          imgShow.setAttribute("src", imgUrl);
        }
      });
    });
  </script>
  <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</html>
